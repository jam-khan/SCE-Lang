<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCE Playground</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f5f4;
      --bg-editor: #fdfdfc;
      --bg-surface: #efedeb;
      --text-primary: #24292f;
      --text-secondary: #57606a;
      --text-muted: #a8a29e;
      --accent: #ec6813;      /* OCaml orange */
      --border: #e2ded9;
      --success: #1a7f37;
      --error: #cf222e;
      --warning: #bf8700;
      /* Syntax — light palette */
      --syn-number: #0550ae;
      --syn-operator: #cf5c16;
      --syn-bracket: #57606a;
      --syn-keyword: #8250df;
      --syn-type: #116329;
      --syn-string: #0a3069;
      --syn-comment: #a8a29e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      line-height: 1.5;
    }

    code, textarea, pre, #highlight-layer {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ── Header ────────────────────────────────────────── */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .logo { display: flex; align-items: baseline; gap: 10px; }
    .logo h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); letter-spacing: -0.03em; }
    .logo span { font-size: 0.8rem; color: var(--text-muted); }

    /* ── Main Layout ───────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    /* ── Panels ────────────────────────────────────────── */
    .editor-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .panel-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 42px;
    }

    .panel-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .styled-select {
      font-size: 0.8125rem;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      outline: none;
    }
    .styled-select:focus { border-color: var(--accent); }

    .btn {
      font-size: 0.8125rem;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { color: var(--text-primary); border-color: var(--text-muted); }

    /* ── Editor (textarea + highlight overlay) ─────────── */
    .editor-container { flex: 1; position: relative; overflow: hidden; }

    #highlight-layer {
      position: absolute;
      inset: 0;
      background: var(--bg-editor);
      color: var(--text-primary);
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-y: auto;
      pointer-events: none;
    }

    #editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: transparent;
      caret-color: var(--accent);
      border: none;
      padding: 16px 20px;
      font-size: 14px;
      line-height: 1.75;
      resize: none;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #editor::placeholder { color: var(--text-muted); }

    .syn-number   { color: var(--syn-number); }
    .syn-operator { color: var(--syn-operator); }
    .syn-bracket  { color: var(--syn-bracket); }
    .syn-keyword  { color: var(--syn-keyword); font-weight: 600; }
    .syn-type     { color: var(--syn-type); }
    .syn-string   { color: var(--syn-string); }
    .syn-comment  { color: var(--syn-comment); font-style: italic; }

    /* ── Output ────────────────────────────────────────── */
    .output-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      overflow: hidden;
    }

    .output-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      font-size: 13px;
      line-height: 1.75;
    }

    .output-entry { margin-bottom: 20px; }

    .output-label {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 3px;
      margin-bottom: 8px;
      background: var(--bg-surface);
      color: var(--text-secondary);
    }
    .output-label.error   { background: rgba(207,34,46,0.08); color: var(--error); }
    .output-label.success { background: rgba(26,127,55,0.10); color: var(--success); }

    .output-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-primary);
    }
    .output-text.error { color: var(--error); }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── Status Bar ────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 0.6875rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-indicator { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.ready   { background: var(--success); }
    .status-dot.loading { background: var(--warning); animation: pulse 1.2s infinite; }
    .status-dot.error   { background: var(--error); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .editor-panel { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <h1>SCE</h1>
      <span>Playground</span>
    </div>
  </header>

  <main>
    <section class="editor-panel">
      <div class="panel-bar">
        <select class="styled-select" id="exampleSelect">
          <option value="">Load example…</option>
        </select>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
      <div class="editor-container">
        <div id="highlight-layer" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" autofocus
                  placeholder="Enter an arithmetic expression"></textarea>
      </div>
    </section>

    <section class="output-panel">
      <div class="panel-bar">
        <span class="panel-label">Output</span>
      </div>
      <div class="output-content" id="output">
        <div class="empty-state">Write a program — it is parsed, desugared, elaborated and run live.</div>
      </div>
      <div class="status-bar">
        <div class="status-indicator">
          <span class="status-dot loading" id="statusDot"></span>
          <span id="statusText">Loading WASM…</span>
        </div>
        <span>SCE v0.1</span>
      </div>
    </section>
  </main>

<script src="playground.bc.wasm.js"></script>
<script>
  const examples = [
    { id: "e1", label: "Basics", code:
`let rec fact (n : Int) : Int =
  if n <= 1 then 1 else n * fact (n - 1)

;; fact 5` },
    { id: "e2", label: "Records", code:
`type Point = { x : Int; y : Int }

let move (p : Point) (dx : Int) : Point =
  { x = p.x + dx; y = p.y }

;; move { x = 1; y = 2 } 10` },
    { id: "e3", label: "Merges", code:
`(* ,, is non-dependent; ,,, lets the right side see the left *)
let plain = { a = 1 } ,, { b = 2 }
let dependent = { a = 1 } ,,, { b = a + 1 }

;; { p = plain.b; d = dependent.b }` },
    { id: "e4", label: "Unions", code:
`type Tagged = Int | String

let render (v : Tagged) : String =
  case v of
    | inl n -> "a number"
    | inr s -> s
  end

;; render (inr "hello" : Tagged)` },
    { id: "e5", label: "Recursive types", code:
`type Nat = mu a. Top | a

let zero : Nat = (fold (inl () : Top | Nat) : mu a. Top | a)
let succ (n : Nat) : Nat = (fold (inr n : Top | Nat) : mu a. Top | a)

;; case unfold (succ zero) of
     | inl u -> "zero"
     | inr m -> "nonzero"
   end` },
    { id: "e6", label: "Modules", code:
`module Counter = struct
  let start : Int = 10
  let bump (n : Int) : Int = n + 1
  let started : Int = bump start
end

(* a sandboxed structure cannot see the enclosing context *)
module Secret = sandbox struct
  let key : Int = 42
end

;; { s = Counter.started; k = Secret.key }` },
    { id: "e7", label: "Functors & linking", code:
`module Counter = struct
  let start : Int = 1
end

(* linking looks the imports up in a module that may be wider *)
module Linked =
  link Counter with functor (X : { start : Int }) -> struct
    let next : Int = X.start + 1
  end

;; Linked.next` },
  ];

  const KEYWORDS = new Set(["let","rec","in","fun","if","then","else","case","of",
    "inl","inr","end","fold","unfold","mu","struct","sandbox","functor","module",
    "open","type","with","link","linkall","box","mod","not","true","false"]);
  const TYPE_NAMES = new Set(["Int","Bool","String","Top"]);

  const editor = document.getElementById('editor');
  const highlight = document.getElementById('highlight-layer');
  const output = document.getElementById('output');

  // ── Syntax highlighting ──────────────────────────────
  function escapeHtml(text) {
    return text.replace(/[&<>]/g, c =>
      c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;');
  }

  // Single pass: each token is classified once, so the markup injected for
  // one token is never rescanned by a later rule.
  function highlightSrc(code) {
    // Comments and strings come first in the alternation so their contents are
    // never rescanned as operators.
    const re = /\(\*[\s\S]*?\*\)|"(?:[^"\\]|\\.)*"|[A-Za-z_][A-Za-z0-9_']*|\d+|,,,|,,|->|=>|<=|>=|<>|&&|\|\||[+\-*/^=<>|&?.:;]|[(){}\[\]]/g;
    return code.replace(re, m => {
      if (m.startsWith('(*')) return `<span class="syn-comment">${escapeHtml(m)}</span>`;
      if (m.startsWith('"'))  return `<span class="syn-string">${escapeHtml(m)}</span>`;
      if (KEYWORDS.has(m))    return `<span class="syn-keyword">${m}</span>`;
      if (TYPE_NAMES.has(m))  return `<span class="syn-type">${m}</span>`;
      if (/^\d/.test(m))      return `<span class="syn-number">${m}</span>`;
      if (/^[A-Za-z_]/.test(m)) return m;
      if (/^[(){}\[\]]$/.test(m)) return `<span class="syn-bracket">${escapeHtml(m)}</span>`;
      return `<span class="syn-operator">${escapeHtml(m)}</span>`;
    });
  }

  function updateHighlight() {
    highlight.innerHTML = highlightSrc(editor.value) + '\n';
  }

  // ── Output ───────────────────────────────────────────
  function entry(label, text, type) {
    const body = type === 'error' ? escapeHtml(text) : highlightSrc(text);
    return `<div class="output-entry">
      <div class="output-label ${type}">${label}</div>
      <pre class="output-text ${type === 'error' ? 'error' : ''}">${body}</pre>
    </div>`;
  }

  function refresh() {
    updateHighlight();
    if (!window.sce) return;
    const src = editor.value;
    if (src.trim() === "") {
      output.innerHTML = '<div class="empty-state">Write a program — it is parsed, desugared, elaborated and run live.</div>';
      return;
    }
    const r = window.sce.run(src);
    let html = "";
    if (r.ok) {
      html += entry("Type", r.typ, "");
      html += entry("Result", r.value, "success");
      html += entry("Elaborated λE", r.core, "");
    } else {
      html += entry("Error", r.error, "error");
    }
    output.innerHTML = html;
  }

  // ── Wiring ───────────────────────────────────────────
  editor.addEventListener('input', refresh);
  editor.addEventListener('scroll', () => {
    highlight.scrollTop = editor.scrollTop;
    highlight.scrollLeft = editor.scrollLeft;
  });

  const select = document.getElementById('exampleSelect');
  examples.forEach(ex => {
    const opt = document.createElement('option');
    opt.value = ex.id;
    opt.textContent = ex.label;
    select.appendChild(opt);
  });
  select.addEventListener('change', () => {
    const ex = examples.find(e => e.id === select.value);
    if (ex) { editor.value = ex.code; refresh(); }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    editor.value = "";
    select.value = "";
    refresh();
  });

  // The wasm module instantiates asynchronously; wait for the export.
  (function ready() {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (window.sce) {
      dot.className = 'status-dot ready';
      txt.textContent = 'Ready';
      editor.value = examples[0].code;
      select.value = examples[0].id;
      refresh();
    } else {
      setTimeout(ready, 30);
    }
  })();
</script>
</body>
</html>
