name: playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wasm_of_ocaml needs a recent binaryen; the apt package is too old
      - name: Install binaryen
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - name: Install dependencies
        run: opam install --yes dune menhir js_of_ocaml js_of_ocaml-ppx wasm_of_ocaml-compiler odoc

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean documentation builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            mechanization/.lake
            mechanization/docbuild/.lake
          key: lean-docs-${{ runner.os }}-${{ hashFiles('mechanization/lean-toolchain', 'mechanization/docbuild/lean-toolchain', 'mechanization/docbuild/lakefile.toml', 'mechanization/docbuild/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-docs-${{ runner.os }}-${{ hashFiles('mechanization/lean-toolchain', 'mechanization/docbuild/lean-toolchain', 'mechanization/docbuild/lakefile.toml', 'mechanization/docbuild/lake-manifest.json') }}-

      - name: Build playground and documentation
        run: opam exec -- make site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
